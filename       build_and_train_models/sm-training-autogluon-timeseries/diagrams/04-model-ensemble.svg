<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="sh4">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arr4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr4g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="url(#bg4)" rx="12"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">AutoGluon Ensemble Architecture</text>
  <text x="600" y="76" text-anchor="middle" fill="#94a3b8" font-size="14">Automatic model selection and weighted combination for optimal accuracy</text>

  <!-- ===== INPUT ===== -->
  <rect x="40" y="120" width="180" height="400" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#sh4)"/>
  <rect x="40" y="120" width="180" height="38" rx="12" fill="#2563eb"/>
  <rect x="40" y="146" width="180" height="12" fill="#2563eb"/>
  <text x="130" y="145" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">INPUT DATA</text>

  <text x="65" y="185" fill="#93c5fd" font-size="11" font-weight="600">Time Series</text>
  <rect x="65" y="192" width="130" height="20" rx="4" fill="#1e3a5f"/>
  <text x="130" y="206" text-anchor="middle" fill="#94a3b8" font-size="9">daily_consumption</text>

  <text x="65" y="235" fill="#93c5fd" font-size="11" font-weight="600">Covariates</text>
  <rect x="65" y="242" width="130" height="20" rx="4" fill="#1e3a5f"/>
  <text x="130" y="256" text-anchor="middle" fill="#94a3b8" font-size="9">tank_type</text>
  <rect x="65" y="266" width="130" height="20" rx="4" fill="#1e3a5f"/>
  <text x="130" y="280" text-anchor="middle" fill="#94a3b8" font-size="9">is_holiday</text>
  <rect x="65" y="290" width="130" height="20" rx="4" fill="#1e3a5f"/>
  <text x="130" y="304" text-anchor="middle" fill="#94a3b8" font-size="9">is_weekend</text>
  <rect x="65" y="314" width="130" height="20" rx="4" fill="#1e3a5f"/>
  <text x="130" y="328" text-anchor="middle" fill="#94a3b8" font-size="9">season features</text>

  <text x="65" y="365" fill="#93c5fd" font-size="11" font-weight="600">Config</text>
  <rect x="65" y="372" width="130" height="20" rx="4" fill="#1e3a5f"/>
  <text x="130" y="386" text-anchor="middle" fill="#94a3b8" font-size="9">prediction_length: 10</text>
  <rect x="65" y="396" width="130" height="20" rx="4" fill="#1e3a5f"/>
  <text x="130" y="410" text-anchor="middle" fill="#94a3b8" font-size="9">freq: D (daily)</text>
  <rect x="65" y="420" width="130" height="20" rx="4" fill="#1e3a5f"/>
  <text x="130" y="434" text-anchor="middle" fill="#94a3b8" font-size="9">eval_metric: MASE</text>

  <text x="130" y="495" text-anchor="middle" fill="#64748b" font-size="10">50 tanks x 365 days</text>

  <!-- ===== ARROWS TO MODELS ===== -->
  <line x1="220" y1="210" x2="290" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="220" y1="310" x2="290" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="220" y1="400" x2="290" y2="470" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr4)"/>

  <!-- ===== STATISTICAL MODELS ===== -->
  <rect x="300" y="110" width="240" height="150" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#sh4)"/>
  <rect x="300" y="110" width="240" height="34" rx="12" fill="#7c3aed"/>
  <rect x="300" y="133" width="240" height="11" fill="#7c3aed"/>
  <text x="420" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">STATISTICAL</text>

  <rect x="320" y="158" width="200" height="28" rx="6" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1"/>
  <text x="340" y="177" fill="#c4b5fd" font-size="12" font-weight="600">ETS</text>
  <text x="500" y="177" text-anchor="end" fill="#94a3b8" font-size="10">Exponential Smoothing</text>

  <rect x="320" y="192" width="200" height="28" rx="6" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1"/>
  <text x="340" y="211" fill="#c4b5fd" font-size="12" font-weight="600">ARIMA</text>
  <text x="500" y="211" text-anchor="end" fill="#94a3b8" font-size="10">Auto-Regressive</text>

  <rect x="320" y="226" width="200" height="28" rx="6" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1"/>
  <text x="340" y="245" fill="#c4b5fd" font-size="12" font-weight="600">Theta</text>
  <text x="500" y="245" text-anchor="end" fill="#94a3b8" font-size="10">Decomposition</text>

  <!-- ===== MACHINE LEARNING MODELS ===== -->
  <rect x="300" y="280" width="240" height="120" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#sh4)"/>
  <rect x="300" y="280" width="240" height="34" rx="12" fill="#d97706"/>
  <rect x="300" y="303" width="240" height="11" fill="#d97706"/>
  <text x="420" y="304" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">MACHINE LEARNING</text>

  <rect x="320" y="328" width="200" height="28" rx="6" fill="#4a3000" stroke="#f59e0b" stroke-width="1"/>
  <text x="340" y="347" fill="#fcd34d" font-size="12" font-weight="600">RecursiveTabular</text>
  <text x="500" y="347" text-anchor="end" fill="#94a3b8" font-size="10">LightGBM</text>

  <rect x="320" y="362" width="200" height="28" rx="6" fill="#4a3000" stroke="#f59e0b" stroke-width="1"/>
  <text x="340" y="381" fill="#fcd34d" font-size="12" font-weight="600">DirectTabular</text>
  <text x="500" y="381" text-anchor="end" fill="#94a3b8" font-size="10">CatBoost</text>

  <!-- ===== DEEP LEARNING MODELS ===== -->
  <rect x="300" y="420" width="240" height="120" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2" filter="url(#sh4)"/>
  <rect x="300" y="420" width="240" height="34" rx="12" fill="#dc2626"/>
  <rect x="300" y="443" width="240" height="11" fill="#dc2626"/>
  <text x="420" y="444" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">DEEP LEARNING</text>

  <rect x="320" y="468" width="200" height="28" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="340" y="487" fill="#fca5a5" font-size="12" font-weight="600">DeepAR</text>
  <text x="500" y="487" text-anchor="end" fill="#94a3b8" font-size="10">Autoregressive RNN</text>

  <rect x="320" y="502" width="200" height="28" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="340" y="521" fill="#fca5a5" font-size="12" font-weight="600">TFT</text>
  <text x="500" y="521" text-anchor="end" fill="#94a3b8" font-size="10">Temporal Fusion</text>

  <!-- ===== ARROWS TO ENSEMBLE ===== -->
  <line x1="540" y1="185" x2="620" y2="280" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="540" y1="340" x2="620" y2="310" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="540" y1="480" x2="620" y2="340" stroke="#ef4444" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- ===== ENSEMBLE ===== -->
  <rect x="630" y="230" width="260" height="180" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="3" filter="url(#sh4)"/>
  <rect x="630" y="230" width="260" height="40" rx="12" fill="#059669"/>
  <rect x="630" y="258" width="260" height="12" fill="#059669"/>
  <text x="760" y="258" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">WEIGHTED ENSEMBLE</text>

  <text x="655" y="295" fill="#6ee7b7" font-size="12" font-weight="600">Learned Weights (example):</text>

  <!-- Weight bars -->
  <text x="655" y="318" fill="#94a3b8" font-size="10">Theta</text>
  <rect x="720" y="306" width="143" height="14" rx="3" fill="#8b5cf6" opacity="0.8"/>
  <text x="868" y="318" fill="#c4b5fd" font-size="10" font-weight="600">0.57</text>

  <text x="655" y="340" fill="#94a3b8" font-size="10">DirectTab</text>
  <rect x="720" y="328" width="68" height="14" rx="3" fill="#f59e0b" opacity="0.8"/>
  <text x="793" y="340" fill="#fcd34d" font-size="10" font-weight="600">0.27</text>

  <text x="655" y="362" fill="#94a3b8" font-size="10">SeasonNaive</text>
  <rect x="720" y="350" width="38" height="14" rx="3" fill="#8b5cf6" opacity="0.8"/>
  <text x="763" y="362" fill="#c4b5fd" font-size="10" font-weight="600">0.15</text>

  <text x="655" y="384" fill="#94a3b8" font-size="10">Naive</text>
  <rect x="720" y="372" width="3" height="14" rx="1" fill="#8b5cf6" opacity="0.8"/>
  <text x="730" y="384" fill="#c4b5fd" font-size="10" font-weight="600">0.01</text>

  <text x="760" y="406" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">Auto-tuned via validation</text>

  <!-- ===== ARROW TO OUTPUT ===== -->
  <line x1="890" y1="320" x2="940" y2="320" stroke="#10b981" stroke-width="3" marker-end="url(#arr4g)"/>

  <!-- ===== OUTPUT ===== -->
  <rect x="950" y="120" width="210" height="400" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#sh4)"/>
  <rect x="950" y="120" width="210" height="38" rx="12" fill="#0891b2"/>
  <rect x="950" y="146" width="210" height="12" fill="#0891b2"/>
  <text x="1055" y="145" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">OUTPUT</text>

  <text x="975" y="185" fill="#67e8f9" font-size="11" font-weight="600">Probabilistic Forecast</text>
  <text x="975" y="205" fill="#94a3b8" font-size="10">10-day horizon per tank</text>

  <!-- Quantile visualization -->
  <rect x="975" y="220" width="160" height="160" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>

  <!-- Simulated fan chart -->
  <text x="985" y="240" fill="#64748b" font-size="8">gal/day</text>

  <!-- p90 band -->
  <polygon points="990,340 1000,336 1020,330 1040,332 1060,328 1080,325 1100,322 1120,318 1120,290 1100,286 1080,280 1060,275 1040,270 1020,268 1000,272 990,280" fill="#ef4444" opacity="0.15"/>
  <!-- p75 band -->
  <polygon points="990,332 1000,328 1020,324 1040,325 1060,322 1080,318 1100,316 1120,312 1120,296 1100,292 1080,288 1060,284 1040,282 1020,280 1000,283 990,290" fill="#f59e0b" opacity="0.2"/>
  <!-- p50 line -->
  <polyline points="990,310 1000,306 1020,302 1040,304 1060,300 1080,298 1100,296 1120,294" stroke="#10b981" stroke-width="2.5" fill="none"/>

  <!-- Labels -->
  <text x="1130" y="320" fill="#ef4444" font-size="8" opacity="0.8">p90</text>
  <text x="1130" y="310" fill="#f59e0b" font-size="8" opacity="0.8">p75</text>
  <text x="1130" y="296" fill="#10b981" font-size="8" font-weight="600">p50</text>
  <text x="1130" y="288" fill="#f59e0b" font-size="8" opacity="0.8">p25</text>
  <text x="1130" y="278" fill="#ef4444" font-size="8" opacity="0.8">p10</text>

  <text x="1055" y="395" text-anchor="middle" fill="#67e8f9" font-size="10">Quantiles: p10, p25, p50, p75, p90</text>

  <text x="975" y="425" fill="#67e8f9" font-size="11" font-weight="600">Used downstream:</text>
  <text x="975" y="445" fill="#94a3b8" font-size="10">p50 → point forecast (mean)</text>
  <text x="975" y="462" fill="#94a3b8" font-size="10">p90 → conservative delivery vol</text>
  <text x="975" y="479" fill="#94a3b8" font-size="10">p10-p90 → risk quantification</text>
  <text x="975" y="496" fill="#94a3b8" font-size="10">spread → confidence assessment</text>

  <!-- ===== BOTTOM: Why Ensemble ===== -->
  <rect x="40" y="560" width="1120" height="100" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="600" y="590" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Why Ensemble Wins</text>

  <rect x="80" y="608" width="240" height="40" rx="8" fill="#2d1b69"/>
  <text x="200" y="625" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Statistical models</text>
  <text x="200" y="641" text-anchor="middle" fill="#94a3b8" font-size="10">Capture trend + seasonality</text>

  <text x="345" y="632" fill="#475569" font-size="20">+</text>

  <rect x="380" y="608" width="240" height="40" rx="8" fill="#4a3000"/>
  <text x="500" y="625" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">ML models</text>
  <text x="500" y="641" text-anchor="middle" fill="#94a3b8" font-size="10">Learn complex covariate effects</text>

  <text x="645" y="632" fill="#475569" font-size="20">+</text>

  <rect x="680" y="608" width="240" height="40" rx="8" fill="#450a0a"/>
  <text x="800" y="625" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Deep learning models</text>
  <text x="800" y="641" text-anchor="middle" fill="#94a3b8" font-size="10">Capture long-range dependencies</text>

  <text x="945" y="632" fill="#475569" font-size="20">=</text>

  <rect x="970" y="605" width="160" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="1050" y="625" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">Best accuracy</text>
  <text x="1050" y="643" text-anchor="middle" fill="#94a3b8" font-size="10">Lower MASE than any single model</text>
</svg>