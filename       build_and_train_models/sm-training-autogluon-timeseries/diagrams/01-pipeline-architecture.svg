<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="inferGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="optGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">Fuel Delivery Optimization Pipeline</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="14">End-to-End Architecture: Amazon SageMaker + AutoGluon-TimeSeries</text>

  <!-- Phase labels row -->
  <text x="135" y="118" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">DATA</text>
  <text x="375" y="118" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">TRAINING</text>
  <text x="615" y="118" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">INFERENCE</text>
  <text x="855" y="118" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">OPTIMIZATION</text>
  <text x="1065" y="118" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">EVALUATION</text>

  <!-- ===== DATA COLUMN ===== -->
  <!-- Tank Readings -->
  <rect x="35" y="135" width="200" height="80" rx="10" fill="url(#dataGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="135" y="168" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Tank Readings</text>
  <text x="135" y="188" text-anchor="middle" fill="#bfdbfe" font-size="11">50 tanks | 365 days</text>
  <text x="135" y="203" text-anchor="middle" fill="#bfdbfe" font-size="11">3 types: res / com / ind</text>

  <!-- Feature Engineering -->
  <rect x="35" y="240" width="200" height="90" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="270" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">Feature Engineering</text>
  <text x="135" y="290" text-anchor="middle" fill="#94a3b8" font-size="10">Lags (1,2,7,14,21)</text>
  <text x="135" y="305" text-anchor="middle" fill="#94a3b8" font-size="10">Rolling stats (7,14,30)</text>
  <text x="135" y="320" text-anchor="middle" fill="#94a3b8" font-size="10">US holidays + seasonality</text>

  <!-- Train/Test Split -->
  <rect x="35" y="355" width="200" height="65" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="383" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">Train / Test Split</text>
  <text x="135" y="403" text-anchor="middle" fill="#94a3b8" font-size="10">Last 10 days held out per tank</text>

  <!-- Arrows within data -->
  <line x1="135" y1="215" x2="135" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>
  <line x1="135" y1="330" x2="135" y2="355" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- ===== TRAINING COLUMN ===== -->
  <!-- SageMaker Training -->
  <rect x="275" y="135" width="200" height="80" rx="10" fill="url(#trainGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="375" y="163" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">SageMaker Training</text>
  <text x="375" y="183" text-anchor="middle" fill="#ddd6fe" font-size="11">ml.m5.xlarge instance</text>
  <text x="375" y="198" text-anchor="middle" fill="#ddd6fe" font-size="11">Managed infrastructure</text>

  <!-- AutoGluon Ensemble -->
  <rect x="275" y="240" width="200" height="120" rx="10" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="268" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">AutoGluon Ensemble</text>
  <text x="375" y="290" text-anchor="middle" fill="#94a3b8" font-size="10">Statistical: ETS, ARIMA, Theta</text>
  <text x="375" y="306" text-anchor="middle" fill="#94a3b8" font-size="10">ML: LightGBM, CatBoost</text>
  <text x="375" y="322" text-anchor="middle" fill="#94a3b8" font-size="10">Deep: DeepAR, TFT</text>
  <text x="375" y="346" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">Weighted Ensemble</text>

  <!-- Model Artifacts -->
  <rect x="275" y="385" width="200" height="55" rx="10" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="408" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">Model Artifacts</text>
  <text x="375" y="428" text-anchor="middle" fill="#94a3b8" font-size="10">S3: model.tar.gz</text>

  <!-- Arrows within training -->
  <line x1="375" y1="215" x2="375" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>
  <line x1="375" y1="360" x2="375" y2="385" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Arrow: data → training -->
  <line x1="235" y1="175" x2="275" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)" stroke-dasharray="6,3"/>

  <!-- ===== INFERENCE COLUMN ===== -->
  <!-- Endpoint -->
  <rect x="515" y="135" width="200" height="80" rx="10" fill="url(#inferGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="615" y="163" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">SageMaker Endpoint</text>
  <text x="615" y="183" text-anchor="middle" fill="#fef3c7" font-size="11">Real-time inference</text>
  <text x="615" y="198" text-anchor="middle" fill="#fef3c7" font-size="11">ml.m5.large</text>

  <!-- Consumption Forecasts -->
  <rect x="515" y="240" width="200" height="100" rx="10" fill="#4a3000" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="615" y="268" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">10-Day Forecasts</text>
  <text x="615" y="290" text-anchor="middle" fill="#94a3b8" font-size="10">Per-tank daily consumption</text>
  <text x="615" y="306" text-anchor="middle" fill="#94a3b8" font-size="10">Quantiles: p10, p25, p50, p75, p90</text>
  <text x="615" y="326" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Probabilistic output</text>

  <!-- Arrows within inference -->
  <line x1="615" y1="215" x2="615" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Arrow: training → inference -->
  <line x1="475" y1="175" x2="515" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)" stroke-dasharray="6,3"/>

  <!-- ===== OPTIMIZATION COLUMN ===== -->
  <!-- Delivery Optimizer -->
  <rect x="755" y="135" width="200" height="80" rx="10" fill="url(#optGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="855" y="163" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Delivery Optimizer</text>
  <text x="855" y="183" text-anchor="middle" fill="#a7f3d0" font-size="11">Uses p90 for safety</text>
  <text x="855" y="198" text-anchor="middle" fill="#a7f3d0" font-size="11">Urgency classification</text>

  <!-- Delivery Schedule -->
  <rect x="755" y="240" width="200" height="100" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="855" y="268" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">Delivery Schedule</text>
  <text x="855" y="290" text-anchor="middle" fill="#94a3b8" font-size="10">Volume per tank</text>
  <text x="855" y="306" text-anchor="middle" fill="#94a3b8" font-size="10">Urgency priority ordering</text>
  <text x="855" y="322" text-anchor="middle" fill="#94a3b8" font-size="10">Daily capacity limits</text>

  <!-- Arrows within optimization -->
  <line x1="855" y1="215" x2="855" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Arrow: inference → optimization -->
  <line x1="715" y1="175" x2="755" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)" stroke-dasharray="6,3"/>

  <!-- ===== EVALUATION COLUMN ===== -->
  <!-- Backtest Engine -->
  <rect x="975" y="135" width="190" height="80" rx="10" fill="url(#evalGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="1070" y="163" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Backtest Engine</text>
  <text x="1070" y="183" text-anchor="middle" fill="#fecaca" font-size="11">Walk-forward simulation</text>
  <text x="1070" y="198" text-anchor="middle" fill="#fecaca" font-size="11">ML vs Heuristic</text>

  <!-- Metrics -->
  <rect x="975" y="240" width="190" height="100" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1070" y="268" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="600">Business Metrics</text>
  <text x="1070" y="290" text-anchor="middle" fill="#94a3b8" font-size="10">Fill rate efficiency</text>
  <text x="1070" y="306" text-anchor="middle" fill="#94a3b8" font-size="10">Emergency delivery rate</text>
  <text x="1070" y="322" text-anchor="middle" fill="#94a3b8" font-size="10">Volume utilization</text>

  <!-- Arrows within evaluation -->
  <line x1="1070" y1="215" x2="1070" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Arrow: optimization → evaluation -->
  <line x1="955" y1="175" x2="975" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)" stroke-dasharray="6,3"/>

  <!-- ===== BOTTOM: Technology Stack ===== -->
  <rect x="35" y="480" width="1130" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <text x="600" y="510" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600" letter-spacing="1.5">TECHNOLOGY STACK</text>

  <!-- Row 1: Core -->
  <rect x="60" y="530" width="160" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="140" y="553" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">AutoGluon TS</text>
  <text x="140" y="570" text-anchor="middle" fill="#64748b" font-size="10">Ensemble forecasting</text>

  <rect x="240" y="530" width="160" height="50" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="320" y="553" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">Amazon SageMaker</text>
  <text x="320" y="570" text-anchor="middle" fill="#64748b" font-size="10">Managed ML platform</text>

  <rect x="420" y="530" width="160" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="553" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">Amazon S3</text>
  <text x="500" y="570" text-anchor="middle" fill="#64748b" font-size="10">Data &amp; model storage</text>

  <rect x="600" y="530" width="160" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="680" y="553" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Python 3.9+</text>
  <text x="680" y="570" text-anchor="middle" fill="#64748b" font-size="10">pandas, numpy</text>

  <rect x="780" y="530" width="160" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="860" y="553" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">holidays</text>
  <text x="860" y="570" text-anchor="middle" fill="#64748b" font-size="10">US Federal + State</text>

  <rect x="960" y="530" width="160" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
  <text x="1040" y="553" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="600">matplotlib</text>
  <text x="1040" y="570" text-anchor="middle" fill="#64748b" font-size="10">Visualization</text>

  <!-- Row 2: Data Flow Description -->
  <text x="600" y="620" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="500">Data Flow</text>
  <text x="600" y="645" text-anchor="middle" fill="#94a3b8" font-size="12">
    Tank Readings (CSV) → Feature Engineering → AutoGluon Training → Probabilistic Forecasts → Delivery Recommendations
  </text>

  <!-- Key numbers -->
  <rect x="120" y="665" width="120" height="30" rx="6" fill="#1e3a5f"/>
  <text x="180" y="685" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">50 Tanks</text>

  <rect x="280" y="665" width="150" height="30" rx="6" fill="#2d1b69"/>
  <text x="355" y="685" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">6+ Model Types</text>

  <rect x="470" y="665" width="160" height="30" rx="6" fill="#4a3000"/>
  <text x="550" y="685" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">10-Day Horizon</text>

  <rect x="670" y="665" width="140" height="30" rx="6" fill="#064e3b"/>
  <text x="740" y="685" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">5 Quantiles</text>

  <rect x="850" y="665" width="180" height="30" rx="6" fill="#450a0a"/>
  <text x="940" y="685" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">4 Urgency Levels</text>
</svg>