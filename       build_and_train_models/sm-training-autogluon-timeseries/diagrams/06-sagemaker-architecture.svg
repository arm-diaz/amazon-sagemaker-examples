<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9900"/>
      <stop offset="100%" style="stop-color:#e68a00"/>
    </linearGradient>
    <filter id="sh6">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arr6" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr6o" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9900"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="url(#bg6)" rx="12"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">SageMaker Training &amp; Deployment</text>
  <text x="600" y="76" text-anchor="middle" fill="#94a3b8" font-size="14">Production-ready ML with managed infrastructure</text>

  <!-- AWS Cloud boundary -->
  <rect x="230" y="95" width="930" height="480" rx="16" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="10,5" opacity="0.4"/>
  <rect x="230" y="95" width="150" height="26" rx="8" fill="#ff9900" opacity="0.15"/>
  <text x="305" y="113" text-anchor="middle" fill="#ff9900" font-size="12" font-weight="700">AWS Cloud</text>

  <!-- ===== LOCAL: User / Notebook ===== -->
  <rect x="30" y="160" width="170" height="140" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#sh6)"/>
  <text x="115" y="195" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Notebook</text>
  <text x="115" y="215" text-anchor="middle" fill="#94a3b8" font-size="10">pipeline.ipynb</text>
  <text x="115" y="240" text-anchor="middle" fill="#64748b" font-size="10">FuelDeliveryPipeline</text>
  <text x="115" y="256" text-anchor="middle" fill="#64748b" font-size="10">.train()</text>
  <text x="115" y="272" text-anchor="middle" fill="#64748b" font-size="10">.deploy()</text>
  <text x="115" y="288" text-anchor="middle" fill="#64748b" font-size="10">.predict()</text>

  <!-- Local label -->
  <text x="115" y="145" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">LOCAL / SAGEMAKER STUDIO</text>

  <!-- Arrow: notebook → S3 -->
  <line x1="200" y1="200" x2="265" y2="200" stroke="#ff9900" stroke-width="2" marker-end="url(#arr6o)"/>
  <text x="232" y="192" text-anchor="middle" fill="#ff9900" font-size="9">upload</text>

  <!-- ===== S3 Bucket ===== -->
  <rect x="275" y="145" width="180" height="130" rx="12" fill="#1e293b" stroke="#ff9900" stroke-width="2" filter="url(#sh6)"/>
  <text x="365" y="175" text-anchor="middle" fill="#ff9900" font-size="14" font-weight="700">Amazon S3</text>

  <rect x="295" y="190" width="140" height="22" rx="4" fill="#3d2300"/>
  <text x="365" y="206" text-anchor="middle" fill="#fbbf24" font-size="10">train.csv</text>

  <rect x="295" y="216" width="140" height="22" rx="4" fill="#3d2300"/>
  <text x="365" y="232" text-anchor="middle" fill="#fbbf24" font-size="10">model.tar.gz</text>

  <rect x="295" y="242" width="140" height="22" rx="4" fill="#3d2300"/>
  <text x="365" y="258" text-anchor="middle" fill="#fbbf24" font-size="10">src/ (training code)</text>

  <!-- Arrow: S3 → Training -->
  <line x1="455" y1="210" x2="505" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- ===== SageMaker Training ===== -->
  <rect x="515" y="130" width="270" height="180" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#sh6)"/>
  <rect x="515" y="130" width="270" height="38" rx="12" fill="#7c3aed"/>
  <rect x="515" y="156" width="270" height="12" fill="#7c3aed"/>
  <text x="650" y="156" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">SageMaker Training Job</text>

  <text x="540" y="192" fill="#c4b5fd" font-size="11" font-weight="600">Instance: ml.m5.xlarge</text>
  <text x="540" y="212" fill="#94a3b8" font-size="10">1. Pulls train.csv + src/ from S3</text>
  <text x="540" y="228" fill="#94a3b8" font-size="10">2. Runs src/train.py</text>
  <text x="540" y="244" fill="#94a3b8" font-size="10">3. AutoGluon fits ensemble models</text>
  <text x="540" y="260" fill="#94a3b8" font-size="10">4. Writes model.tar.gz to S3</text>

  <rect x="540" y="270" width="220" height="22" rx="4" fill="#2d1b69"/>
  <text x="650" y="286" text-anchor="middle" fill="#c4b5fd" font-size="10">Hyperparameters: pred_len=10, freq=D</text>

  <!-- Arrow: Training → S3 (model) -->
  <path d="M 515 280 Q 460 280 460 235 Q 460 235 455 235" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arr6)"/>
  <text x="475" y="270" fill="#8b5cf6" font-size="8">model</text>

  <!-- Arrow: Training → Model Creation -->
  <line x1="785" y1="220" x2="835" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- ===== SageMaker Model ===== -->
  <rect x="845" y="130" width="270" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#sh6)"/>
  <rect x="845" y="130" width="270" height="38" rx="12" fill="#059669"/>
  <rect x="845" y="156" width="270" height="12" fill="#059669"/>
  <text x="980" y="156" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">SageMaker Model + Endpoint</text>

  <text x="870" y="192" fill="#6ee7b7" font-size="11" font-weight="600">Model Creation</text>
  <text x="870" y="212" fill="#94a3b8" font-size="10">1. Repacks model.tar.gz + inference code</text>
  <text x="870" y="228" fill="#94a3b8" font-size="10">2. Creates SageMaker Model object</text>

  <text x="870" y="254" fill="#6ee7b7" font-size="11" font-weight="600">Endpoint Deployment</text>
  <text x="870" y="274" fill="#94a3b8" font-size="10">3. Creates endpoint config (ml.m5.large)</text>
  <text x="870" y="290" fill="#94a3b8" font-size="10">4. Deploys real-time inference endpoint</text>

  <!-- Arrow: endpoint → notebook (predict) -->
  <path d="M 980 310 L 980 400 Q 980 420 960 420 L 200 420" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arr6)"/>
  <text x="590" y="412" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">predictions (JSON)</text>

  <!-- Arrow: notebook → endpoint (invoke) -->
  <path d="M 200 260 L 220 260 Q 240 260 240 280 L 240 450 Q 240 470 260 470 L 960 470 Q 980 470 980 450 L 980 430" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arr6)"/>
  <text x="590" y="480" text-anchor="middle" fill="#3b82f6" font-size="10">invoke endpoint (tank readings CSV)</text>

  <!-- ===== INFERENCE DETAIL ===== -->
  <rect x="275" y="360" width="520" height="180" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#sh6)"/>
  <rect x="275" y="360" width="520" height="36" rx="12" fill="#0891b2"/>
  <rect x="275" y="385" width="520" height="11" fill="#0891b2"/>
  <text x="535" y="384" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">SageMaker Inference Contract (src/inference.py)</text>

  <!-- 4 functions -->
  <rect x="300" y="410" width="110" height="50" rx="6" fill="#164e63" stroke="#06b6d4" stroke-width="1"/>
  <text x="355" y="432" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">model_fn()</text>
  <text x="355" y="450" text-anchor="middle" fill="#94a3b8" font-size="9">Load predictor</text>

  <line x1="410" y1="435" x2="430" y2="435" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr6)"/>

  <rect x="435" y="410" width="110" height="50" rx="6" fill="#164e63" stroke="#06b6d4" stroke-width="1"/>
  <text x="490" y="432" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">input_fn()</text>
  <text x="490" y="450" text-anchor="middle" fill="#94a3b8" font-size="9">Parse CSV/JSON</text>

  <line x1="545" y1="435" x2="565" y2="435" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr6)"/>

  <rect x="570" y="410" width="110" height="50" rx="6" fill="#164e63" stroke="#06b6d4" stroke-width="1"/>
  <text x="625" y="432" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">predict_fn()</text>
  <text x="625" y="450" text-anchor="middle" fill="#94a3b8" font-size="9">Run forecast</text>

  <line x1="680" y1="435" x2="700" y2="435" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr6)"/>

  <rect x="705" y="410" width="70" height="50" rx="6" fill="#164e63" stroke="#06b6d4" stroke-width="1"/>
  <text x="740" y="432" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">output_fn()</text>
  <text x="740" y="450" text-anchor="middle" fill="#94a3b8" font-size="9">Format</text>

  <text x="535" y="490" text-anchor="middle" fill="#94a3b8" font-size="11">Input: tank readings (CSV) → Output: 10-day quantile forecasts (JSON/CSV)</text>

  <text x="535" y="525" text-anchor="middle" fill="#67e8f9" font-size="11">Column mapping: tank_id → item_id, reading_date → timestamp, daily_consumption → target</text>

  <!-- Key benefit -->
  <rect x="845" y="360" width="270" height="180" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="980" y="390" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Benefits</text>

  <text x="870" y="418" fill="#10b981" font-size="18">&#x2713;</text>
  <text x="895" y="418" fill="#94a3b8" font-size="11">Managed infrastructure</text>

  <text x="870" y="442" fill="#10b981" font-size="18">&#x2713;</text>
  <text x="895" y="442" fill="#94a3b8" font-size="11">Auto-scaling endpoints</text>

  <text x="870" y="466" fill="#10b981" font-size="18">&#x2713;</text>
  <text x="895" y="466" fill="#94a3b8" font-size="11">GPU training, CPU inference</text>

  <text x="870" y="490" fill="#10b981" font-size="18">&#x2713;</text>
  <text x="895" y="490" fill="#94a3b8" font-size="11">Reproducible experiments</text>

  <text x="870" y="514" fill="#10b981" font-size="18">&#x2713;</text>
  <text x="895" y="514" fill="#94a3b8" font-size="11">Pay per use (no idle costs)</text>

  <!-- Bottom bar -->
  <rect x="30" y="580" width="1140" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-size="12">
    Local development (Sections 1-5) → SageMaker Training (Section 6) → Deployment (Section 7) → Real-time Inference (Section 8)
  </text>
</svg>