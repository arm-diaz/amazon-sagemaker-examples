<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="sh5">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arr5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg5)" rx="12"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">Data Flow &amp; Feature Engineering</text>
  <text x="600" y="76" text-anchor="middle" fill="#94a3b8" font-size="14">From raw tank readings to ML-ready training data</text>

  <!-- ===== RAW DATA ===== -->
  <rect x="40" y="110" width="230" height="260" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#sh5)"/>
  <rect x="40" y="110" width="230" height="36" rx="12" fill="#2563eb"/>
  <rect x="40" y="135" width="230" height="11" fill="#2563eb"/>
  <text x="155" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">RAW TANK READINGS</text>

  <text x="65" y="172" fill="#93c5fd" font-size="11" font-weight="600">Core Columns</text>
  <rect x="65" y="180" width="180" height="22" rx="4" fill="#1e3a5f"/>
  <text x="75" y="196" fill="#60a5fa" font-size="10" font-weight="600">tank_id</text>
  <text x="215" y="196" text-anchor="end" fill="#94a3b8" font-size="9">TANK_0001</text>

  <rect x="65" y="206" width="180" height="22" rx="4" fill="#1e3a5f"/>
  <text x="75" y="222" fill="#60a5fa" font-size="10" font-weight="600">reading_date</text>
  <text x="215" y="222" text-anchor="end" fill="#94a3b8" font-size="9">2024-06-15</text>

  <rect x="65" y="232" width="180" height="22" rx="4" fill="#1e3a5f"/>
  <text x="75" y="248" fill="#fcd34d" font-size="10" font-weight="600">daily_consumption</text>
  <text x="215" y="248" text-anchor="end" fill="#94a3b8" font-size="9">5.23 gal</text>

  <rect x="65" y="258" width="180" height="22" rx="4" fill="#1e3a5f"/>
  <text x="75" y="274" fill="#94a3b8" font-size="10">tank_type</text>
  <text x="215" y="274" text-anchor="end" fill="#94a3b8" font-size="9">residential</text>

  <rect x="65" y="284" width="180" height="22" rx="4" fill="#1e3a5f"/>
  <text x="75" y="300" fill="#94a3b8" font-size="10">tank_capacity</text>
  <text x="215" y="300" text-anchor="end" fill="#94a3b8" font-size="9">275 gal</text>

  <rect x="65" y="310" width="180" height="22" rx="4" fill="#1e3a5f"/>
  <text x="75" y="326" fill="#94a3b8" font-size="10">current_level</text>
  <text x="215" y="326" text-anchor="end" fill="#94a3b8" font-size="9">180.5 gal</text>

  <text x="155" y="358" text-anchor="middle" fill="#64748b" font-size="10">50 tanks x 365 days = 18,250 rows</text>

  <!-- Arrow -->
  <line x1="270" y1="240" x2="310" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- ===== FEATURE ENGINEERING ===== -->
  <rect x="320" y="110" width="530" height="520" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#sh5)"/>
  <rect x="320" y="110" width="530" height="36" rx="12" fill="#7c3aed"/>
  <rect x="320" y="135" width="530" height="11" fill="#7c3aed"/>
  <text x="585" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">FEATURE ENGINEERING PIPELINE</text>

  <!-- Time Features -->
  <rect x="345" y="162" width="240" height="130" rx="8" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1"/>
  <text x="465" y="182" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">Time Features</text>
  <text x="360" y="202" fill="#94a3b8" font-size="10">day_of_week (0-6)</text>
  <text x="360" y="218" fill="#94a3b8" font-size="10">day_of_month (1-31)</text>
  <text x="360" y="234" fill="#94a3b8" font-size="10">month (1-12)</text>
  <text x="360" y="250" fill="#94a3b8" font-size="10">is_weekend (0/1)</text>
  <text x="360" y="266" fill="#94a3b8" font-size="10">is_holiday (US Federal)</text>
  <text x="360" y="282" fill="#94a3b8" font-size="10">season (winter/spring/...)</text>

  <!-- Lag Features -->
  <rect x="595" y="162" width="240" height="130" rx="8" fill="#4a3000" stroke="#f59e0b" stroke-width="1"/>
  <text x="715" y="182" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700">Lag Features</text>
  <text x="610" y="202" fill="#94a3b8" font-size="10">consumption_lag_1</text>
  <text x="610" y="218" fill="#94a3b8" font-size="10">consumption_lag_2</text>
  <text x="610" y="234" fill="#94a3b8" font-size="10">consumption_lag_7</text>
  <text x="610" y="250" fill="#94a3b8" font-size="10">consumption_lag_14</text>
  <text x="610" y="266" fill="#94a3b8" font-size="10">consumption_lag_21</text>
  <text x="610" y="282" fill="#64748b" font-size="9" font-style="italic">Recent history context</text>

  <!-- Rolling Features -->
  <rect x="345" y="302" width="240" height="130" rx="8" fill="#0a1f17" stroke="#10b981" stroke-width="1"/>
  <text x="465" y="322" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">Rolling Statistics</text>
  <text x="360" y="342" fill="#94a3b8" font-size="10">rolling_mean_7d</text>
  <text x="360" y="358" fill="#94a3b8" font-size="10">rolling_std_7d</text>
  <text x="360" y="374" fill="#94a3b8" font-size="10">rolling_mean_14d</text>
  <text x="360" y="390" fill="#94a3b8" font-size="10">rolling_mean_30d</text>
  <text x="360" y="406" fill="#94a3b8" font-size="10">rolling_min/max_7d</text>
  <text x="360" y="422" fill="#94a3b8" font-size="10">trend_slope_7d (linear fit)</text>

  <!-- Tank State Features -->
  <rect x="595" y="302" width="240" height="130" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="715" y="322" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Tank State Features</text>
  <text x="610" y="342" fill="#94a3b8" font-size="10">capacity_utilization (%)</text>
  <text x="610" y="358" fill="#94a3b8" font-size="10">days_of_inventory</text>
  <text x="610" y="374" fill="#94a3b8" font-size="10">distance_to_reorder</text>
  <text x="610" y="390" fill="#94a3b8" font-size="10">is_spike (z-score > 2)</text>
  <text x="610" y="406" fill="#94a3b8" font-size="10">volatility_7d</text>
  <text x="610" y="422" fill="#94a3b8" font-size="10">consumption_accel</text>

  <!-- Holiday Features -->
  <rect x="345" y="442" width="490" height="60" rx="8" fill="#164e63" stroke="#06b6d4" stroke-width="1"/>
  <text x="590" y="462" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">US Holiday Features</text>
  <text x="360" y="482" fill="#94a3b8" font-size="10">is_holiday | holiday_name | days_to_next_holiday | is_day_before_holiday | is_day_after_holiday</text>
  <text x="360" y="496" fill="#64748b" font-size="9">Federal holidays + configurable state holidays via holidays.US library</text>

  <!-- Build pipeline label -->
  <rect x="345" y="512" width="490" height="35" rx="8" fill="#7c3aed" opacity="0.3" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="590" y="534" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">build_feature_pipeline() — orchestrates all of the above</text>

  <!-- ===== TRAIN / TEST SPLIT ===== -->
  <text x="585" y="575" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">TRAIN / TEST SPLIT</text>

  <!-- Arrow down -->
  <line x1="480" y1="585" x2="480" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="690" y1="585" x2="690" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- Train set -->
  <rect x="370" y="615" width="220" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="480" y="640" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">Training Set</text>
  <text x="480" y="660" text-anchor="middle" fill="#94a3b8" font-size="11">355 days per tank (all but last 10)</text>

  <!-- Test set -->
  <rect x="610" y="615" width="180" height="60" rx="8" fill="#4a3000" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="700" y="640" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">Test Set</text>
  <text x="700" y="660" text-anchor="middle" fill="#94a3b8" font-size="11">Last 10 days per tank</text>

  <!-- Arrow to output -->
  <line x1="850" y1="340" x2="890" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- ===== OUTPUT ===== -->
  <rect x="900" y="110" width="260" height="260" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#sh5)"/>
  <rect x="900" y="110" width="260" height="36" rx="12" fill="#0891b2"/>
  <rect x="900" y="135" width="260" height="11" fill="#0891b2"/>
  <text x="1030" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ML-READY DATA</text>

  <text x="925" y="172" fill="#67e8f9" font-size="11" font-weight="600">Schema</text>
  <text x="925" y="192" fill="#94a3b8" font-size="10">tank_id (item identifier)</text>
  <text x="925" y="208" fill="#94a3b8" font-size="10">reading_date (timestamp)</text>
  <text x="925" y="224" fill="#fcd34d" font-size="10" font-weight="600">daily_consumption (TARGET)</text>
  <text x="925" y="244" fill="#94a3b8" font-size="10">+ 6 time features</text>
  <text x="925" y="260" fill="#94a3b8" font-size="10">+ 5 lag features</text>
  <text x="925" y="276" fill="#94a3b8" font-size="10">+ 8 rolling features</text>
  <text x="925" y="292" fill="#94a3b8" font-size="10">+ 6 tank state features</text>
  <text x="925" y="308" fill="#94a3b8" font-size="10">+ 5 holiday features</text>

  <rect x="925" y="318" width="210" height="3" rx="1" fill="#334155"/>
  <text x="1030" y="340" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="600">~30+ features per row</text>
  <text x="1030" y="358" text-anchor="middle" fill="#94a3b8" font-size="10">Feeds into AutoGluon</text>

  <!-- Arrow down to AutoGluon -->
  <line x1="1030" y1="375" x2="1030" y2="420" stroke="#10b981" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="920" y="425" width="220" height="45" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="1030" y="448" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">AutoGluon Training</text>
  <text x="1030" y="464" text-anchor="middle" fill="#94a3b8" font-size="10">Automatic model selection</text>

  <!-- Bottom summary -->
  <rect x="40" y="555" width="300" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="190" y="582" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Feature Categories</text>
  <rect x="65" y="595" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="85" y="606" fill="#94a3b8" font-size="11">Time — when does consumption happen?</text>
  <rect x="65" y="615" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="85" y="626" fill="#94a3b8" font-size="11">Lags — what happened recently?</text>
  <rect x="65" y="635" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="85" y="646" fill="#94a3b8" font-size="11">Rolling — what's the trend?</text>
  <rect x="65" y="655" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="85" y="666" fill="#94a3b8" font-size="11">Tank state — how urgent is the need?</text>
</svg>